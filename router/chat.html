<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Router</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#ffffff;--sidebar:#f9f9f9;--border:#e5e5e5;
  --text:#0d0d0d;--text2:#6b6b6b;--text3:#b4b4b4;
  --accent:#6366f1;--accent-hover:#4f52d3;
  --hover:#f0f0f0;--active:#ebebeb;
  --user-bubble:#f4f4f4;--code-bg:#f7f7f8;
  --shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.06);
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;height:100vh;overflow:hidden}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Login ── */
#loginView{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;align-items:center;justify-content:center}
.login-card{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:100%;max-width:380px;text-align:center;box-shadow:var(--shadow)}
.login-logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px}
.login-logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
.login-logo-icon svg{width:18px;height:18px;stroke:#fff;fill:none}
.login-logo span{font-size:1.1rem;font-weight:700;color:var(--text)}
.login-card h1{font-size:1.3rem;font-weight:700;margin-bottom:6px}
.login-card p{color:var(--text2);font-size:14px;margin-bottom:28px}
.login-error{color:var(--red);font-size:13px;margin-bottom:12px;display:none}
.login-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-size:14px;margin-bottom:14px;font-family:inherit;transition:border-color .15s}
.login-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.login-btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.login-btn:hover{background:var(--accent-hover)}

/* ── App layout ── */
#appView{display:none;height:100vh}
.app{display:flex;height:100vh}

/* ── Sidebar ── */
.sidebar{width:260px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .2s}
.sidebar-top{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px}
.sidebar-logo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:.95rem;color:var(--accent)}
.sidebar-logo svg{width:18px;height:18px;stroke:var(--accent);fill:none}
.sidebar-top-btns{display:flex;gap:2px}
.icon-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:7px;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.new-chat-btn{margin:0 10px 8px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;border:none;background:none;cursor:pointer;font-size:13.5px;font-family:inherit;color:var(--text2);transition:background .12s,color .12s;text-align:left}
.new-chat-btn:hover{background:var(--hover);color:var(--text)}
.new-chat-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.sidebar-list{flex:1;overflow-y:auto;padding:4px 8px 8px}
.sidebar-group{padding:6px 8px 3px;font-size:10.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.sidebar-item{display:flex;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);transition:background .1s;position:relative;gap:6px}
.sidebar-item:hover{background:var(--hover)}
.sidebar-item.active{background:var(--active);color:var(--text)}
.sidebar-item .s-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del-btn{display:none;background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;line-height:1;padding:0 2px;flex-shrink:0;transition:color .12s}
.sidebar-item:hover .del-btn{display:block}
.del-btn:hover{color:var(--red)}
.sidebar-footer{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-sub{font-size:11px;color:var(--text3)}
.signout-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:7px;color:var(--text2);display:flex;align-items:center;transition:background .12s,color .12s}
.signout-btn:hover{background:var(--hover);color:var(--text)}
.signout-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ── Main area ── */
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.chat-header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:52px}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;border-radius:7px;color:var(--text2)}
.hamburger svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.hamburger:hover{background:var(--hover)}
.model-badge{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--sidebar);border:1px solid var(--border);border-radius:20px;font-size:12.5px;font-weight:500;color:var(--text2)}
.model-badge .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0}

/* ── Messages ── */
.messages{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:20px}
.msg{display:flex;flex-direction:column;max-width:720px;width:100%;margin:0 auto;animation:fadeUp .18s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.user{align-items:flex-end}
.msg.assistant{align-items:flex-start}
.user-bubble{padding:12px 16px;background:var(--user-bubble);border-radius:18px;border-bottom-right-radius:4px;font-size:14.5px;line-height:1.65;word-break:break-word;color:var(--text);max-width:85%}
.asst-header{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.asst-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}
.asst-label{font-size:12.5px;font-weight:600;color:var(--text)}
.provider-pill{font-size:11px;padding:2px 7px;background:var(--sidebar);border:1px solid var(--border);border-radius:10px;color:var(--text2)}
.asst-body{font-size:14.5px;line-height:1.75;color:var(--text);word-break:break-word;width:100%}
.msg.error .asst-body{background:var(--red-bg);border:1px solid var(--red-border);border-radius:10px;padding:10px 14px;color:var(--red)}

/* Markdown */
.asst-body code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-family:'SF Mono',Monaco,Consolas,monospace;font-size:12.5px;color:var(--text)}
.asst-body pre{background:var(--code-bg);border:1px solid var(--border);padding:14px 16px;border-radius:10px;overflow-x:auto;margin:10px 0}
.asst-body pre code{background:none;padding:0;font-size:12.5px}
.asst-body p{margin:6px 0}
.asst-body p:first-child{margin-top:0}
.asst-body p:last-child{margin-bottom:0}
.asst-body strong{font-weight:600}

/* Typing indicator */
.typing-wrap{display:flex;align-items:center;gap:7px;padding:6px 0}
.typing{display:flex;gap:4px}
.typing span{width:7px;height:7px;background:var(--text3);border-radius:50%;animation:bounce .7s infinite alternate}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes bounce{to{opacity:.3;transform:translateY(-4px)}}

/* ── Empty state ── */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 20px;text-align:center}
.empty-greeting{font-size:2rem;font-weight:600;color:var(--text)}
.empty-sub{font-size:15px;color:var(--text2);margin-top:-16px}
.suggestion-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.chip{padding:8px 16px;border:1px solid var(--border);border-radius:20px;font-size:13.5px;color:var(--text2);cursor:pointer;background:var(--bg);font-family:inherit;transition:background .12s,color .12s,border-color .12s}
.chip:hover{background:var(--hover);color:var(--text);border-color:var(--text3)}

/* ── Input area ── */
.input-area{padding:12px 20px 20px;flex-shrink:0}
.input-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.selector-row{display:flex;gap:6px}
.selector-pill{position:relative}
.sel-btn{display:flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);border-radius:16px;font-size:12.5px;font-family:inherit;color:var(--text2);background:var(--bg);cursor:pointer;transition:background .12s,border-color .12s}
.sel-btn:hover{background:var(--hover);border-color:var(--text3)}
.sel-btn .pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sel-btn .caret{font-size:9px;margin-left:1px;color:var(--text3)}
.dropdown{display:none;position:absolute;bottom:calc(100% + 6px);left:0;background:var(--bg);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);min-width:180px;z-index:50;overflow:hidden;max-height:280px;overflow-y:auto}
.dropdown.open{display:block}
.dropdown-section{padding:4px 0}
.dropdown-label{padding:6px 12px 3px;font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.dropdown-item{padding:7px 14px;font-size:13px;cursor:pointer;color:var(--text2);display:flex;align-items:center;gap:7px;transition:background .1s}
.dropdown-item:hover{background:var(--hover)}
.dropdown-item.selected{color:var(--accent);font-weight:600}
.dropdown-item .pdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.input-box{display:flex;align-items:flex-end;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:var(--shadow);transition:border-color .15s}
.input-box:focus-within{border-color:var(--accent)}
.input-box textarea{flex:1;border:none;outline:none;background:transparent;color:var(--text);font-size:14.5px;font-family:inherit;resize:none;line-height:1.55;min-height:24px;max-height:180px;overflow-y:auto;padding:0}
.input-box textarea::placeholder{color:var(--text3)}
.send-btn{width:34px;height:34px;background:var(--accent);border:none;border-radius:9px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.send-btn:hover{background:var(--accent-hover)}
.send-btn:disabled{opacity:.35;cursor:not-allowed}
.send-btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ── Mobile overlay ── */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9;backdrop-filter:blur(1px)}
.sidebar-overlay.open{display:block}

@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:10;transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .hamburger{display:flex}
  .msg{max-width:100%}
  .user-bubble{max-width:95%}
  .messages{padding:16px 14px}
  .input-area{padding:10px 14px 16px}
  .empty-greeting{font-size:1.5rem}
}
</style>
</head>
<body>

<!-- Login -->
<div id="loginView">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg viewBox="0 0 24 24" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <span>AI Router</span>
    </div>
    <h1>Welcome back</h1>
    <p>Sign in with your API key to continue</p>
    <div class="login-error" id="loginError">Invalid API key. Please try again.</div>
    <input class="login-input" id="loginKey" type="password" placeholder="Enter your API key" autocomplete="current-password">
    <button class="login-btn" onclick="signIn()">Sign In</button>
  </div>
</div>

<!-- App -->
<div id="appView">
  <div class="app">
    <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-logo">
          <svg viewBox="0 0 24 24" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          AI Router
        </div>
        <div class="sidebar-top-btns">
          <button class="icon-btn" title="New chat" onclick="newChat()">
            <svg viewBox="0 0 24 24"><path d="M12 5H5a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
        </div>
      </div>
      <button class="new-chat-btn" onclick="newChat()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>
      <div class="sidebar-list" id="sidebarList"></div>
      <div class="sidebar-footer">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-info">
          <div class="user-name" id="userName">–</div>
          <div class="user-sub">AI Router</div>
        </div>
        <button class="signout-btn" title="Sign out" onclick="signOut()">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <main class="chat-area">
      <div class="chat-header" id="chatHeader">
        <button class="hamburger" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" stroke-width="1.8"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="model-badge" id="modelBadge" style="display:none">
          <span class="dot"></span>
          <span id="badgeText">–</span>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <div class="input-inner">
          <div class="selector-row">
            <div class="selector-pill" id="providerPill">
              <button class="sel-btn" id="providerBtn" onclick="toggleDropdown('providerDrop')">
                <span class="pdot" id="providerDot"></span>
                <span id="providerBtnText">Provider</span>
                <span class="caret">▾</span>
              </button>
              <div class="dropdown" id="providerDrop"></div>
            </div>
            <div class="selector-pill" id="modelPill">
              <button class="sel-btn" id="modelBtn" onclick="toggleDropdown('modelDrop')">
                <span id="modelBtnText">Model</span>
                <span class="caret">▾</span>
              </button>
              <div class="dropdown" id="modelDrop"></div>
            </div>
          </div>
          <div class="input-box">
            <textarea id="input" rows="1" placeholder="Ask anything..." onkeydown="onKey(event)" oninput="autoResize(this)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="send()">
              <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
var PROVIDERS = {
  Claude:  ['claude-fable-5-1','claude-opus-5','claude-sonnet-5','claude-opus-4-6','claude-sonnet-4-6','claude-opus-4-5','claude-haiku-4-5'],
  Gemini:  ['gemini-3-flash','gemini-3-pro','gemini-3-flash-lite'],
  ChatGPT: ['gpt-4o','gpt-5-5','gpt-5-6','gpt-5.6-sol-wm','gpt-6-astra-wm','gpt-5.6-terra-wm','gpt-5-5-thinking','gpt-5-5-mini'],
  Kimi:    ['k2d6-chat','k2-chat','k2-0711-preview','kimi-latest','k1.5','moonshot-v1-8k','moonshot-v1-32k','moonshot-v1-128k']
};
var PROVIDER_COLORS = { Claude:'#d97706', Gemini:'#0ea5e9', ChatGPT:'#10a37f', Kimi:'#8b5cf6' };
var DEFAULT_PROVIDER = 'Gemini';
var DEFAULT_MODEL = 'gemini-3-flash';
var STORAGE_KEY = 'router_chat_key';
var CHATS_KEY = 'router_chats';
var MAX_CHATS = 50;

var SUGGESTIONS = ['Explain a concept','Write some code','Summarize text','Translate text'];

var apiKey = '', chats = [], activeChatId = null, sending = false;
var curProvider = DEFAULT_PROVIDER, curModel = DEFAULT_MODEL;

function byId(s) { return document.getElementById(s); }

// ── Auth ──────────────────────────────────────────────
async function signIn() {
  var key = byId('loginKey').value.trim();
  if (!key) return;
  try {
    var res = await fetch('/me', {headers:{'Authorization':'Bearer '+key}});
    if (!res.ok) { showLoginError('Invalid API key. Please try again.'); return; }
    var user = await res.json();
    apiKey = key;
    localStorage.setItem(STORAGE_KEY, key);
    hideLoginError();
    bootApp(user);
  } catch(e) { showLoginError('Connection error. Check your network.'); }
}

function signOut() {
  apiKey = '';
  localStorage.removeItem(STORAGE_KEY);
  byId('loginView').style.display = 'flex';
  byId('appView').style.display = 'none';
  byId('loginKey').value = '';
}

async function tryAutoLogin() {
  var key = localStorage.getItem(STORAGE_KEY);
  if (!key) { byId('loginView').style.display = 'flex'; return; }
  try {
    var res = await fetch('/me', {headers:{'Authorization':'Bearer '+key}});
    if (res.ok) { apiKey = key; bootApp(await res.json()); return; }
  } catch(e) {}
  localStorage.removeItem(STORAGE_KEY);
  byId('loginView').style.display = 'flex';
}

function showLoginError(msg) { var e = byId('loginError'); e.textContent = msg; e.style.display = 'block'; }
function hideLoginError() { byId('loginError').style.display = 'none'; }

// ── Boot ──────────────────────────────────────────────
function bootApp(user) {
  byId('loginView').style.display = 'none';
  byId('appView').style.display = 'block';
  var name = user.name || user.id || 'You';
  byId('userName').textContent = name;
  byId('userAvatar').textContent = name.charAt(0).toUpperCase();
  loadChats();
  initSelectors();
  renderSidebar();
  if (activeChatId) renderMessages(); else renderEmpty(name);
}

// ── Selectors ──────────────────────────────────────────
function initSelectors() {
  setProvider(curProvider, false);
}

function setProvider(p, keepModel) {
  curProvider = p;
  // dot color
  byId('providerDot').style.background = PROVIDER_COLORS[p] || '#888';
  byId('providerBtnText').textContent = p;
  // model list
  var models = PROVIDERS[p] || [];
  if (!keepModel || models.indexOf(curModel) === -1) curModel = models[0] || '';
  byId('modelBtnText').textContent = curModel;
  rebuildProviderDrop();
  rebuildModelDrop();
  updateBadge();
}

function setModel(m) {
  curModel = m;
  byId('modelBtnText').textContent = m;
  rebuildModelDrop();
  updateBadge();
}

function rebuildProviderDrop() {
  var d = byId('providerDrop');
  d.innerHTML = '';
  var sec = document.createElement('div'); sec.className = 'dropdown-section';
  var lbl = document.createElement('div'); lbl.className = 'dropdown-label'; lbl.textContent = 'Providers';
  sec.appendChild(lbl);
  Object.keys(PROVIDERS).forEach(function(p) {
    var item = document.createElement('div');
    item.className = 'dropdown-item' + (p === curProvider ? ' selected' : '');
    var dot = document.createElement('span'); dot.className = 'pdot';
    dot.style.background = PROVIDER_COLORS[p] || '#888';
    item.appendChild(dot);
    item.appendChild(document.createTextNode(p));
    item.onclick = function() { setProvider(p, false); closeDropdowns(); };
    sec.appendChild(item);
  });
  d.appendChild(sec);
}

function rebuildModelDrop() {
  var d = byId('modelDrop');
  d.innerHTML = '';
  var sec = document.createElement('div'); sec.className = 'dropdown-section';
  var lbl = document.createElement('div'); lbl.className = 'dropdown-label'; lbl.textContent = curProvider;
  sec.appendChild(lbl);
  (PROVIDERS[curProvider] || []).forEach(function(m) {
    var item = document.createElement('div');
    item.className = 'dropdown-item' + (m === curModel ? ' selected' : '');
    item.appendChild(document.createTextNode(m));
    item.onclick = function() { setModel(m); closeDropdowns(); };
    sec.appendChild(item);
  });
  d.appendChild(sec);
}

function toggleDropdown(id) {
  var target = byId(id);
  var wasOpen = target.classList.contains('open');
  closeDropdowns();
  if (!wasOpen) { rebuildProviderDrop(); rebuildModelDrop(); target.classList.add('open'); }
}

function closeDropdowns() {
  document.querySelectorAll('.dropdown.open').forEach(function(d) { d.classList.remove('open'); });
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.selector-pill')) closeDropdowns();
});

function updateBadge() {
  var badge = byId('modelBadge'); var bt = byId('badgeText');
  if (activeChatId) {
    badge.style.display = 'flex';
    bt.textContent = curProvider + ' · ' + curModel;
  } else { badge.style.display = 'none'; }
}

// ── Chat storage ──────────────────────────────────────
function loadChats() {
  try { chats = JSON.parse(localStorage.getItem(CHATS_KEY) || '[]'); } catch(e) { chats = []; }
  if (chats.length) activeChatId = chats[0].id;
}
function saveChats() {
  if (chats.length > MAX_CHATS) chats.length = MAX_CHATS;
  localStorage.setItem(CHATS_KEY, JSON.stringify(chats));
}
function getChat(id) { for (var i=0;i<chats.length;i++) if(chats[i].id===id) return chats[i]; return null; }
function activeChat() { return activeChatId ? getChat(activeChatId) : null; }

// ── Sidebar ───────────────────────────────────────────
function renderSidebar() {
  var list = byId('sidebarList'); list.textContent = '';
  var now = Date.now();
  var today = new Date(); today.setHours(0,0,0,0);
  var yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
  var week = new Date(today); week.setDate(today.getDate()-7);
  var groups = [['Today',[]],['Yesterday',[]],['This Week',[]],['Older',[]]];
  chats.forEach(function(c) {
    var t = c.updatedAt || c.createdAt;
    if (t >= today.getTime()) groups[0][1].push(c);
    else if (t >= yesterday.getTime()) groups[1][1].push(c);
    else if (t >= week.getTime()) groups[2][1].push(c);
    else groups[3][1].push(c);
  });
  groups.forEach(function(g) {
    if (!g[1].length) return;
    var lbl = document.createElement('div'); lbl.className='sidebar-group'; lbl.textContent=g[0];
    list.appendChild(lbl);
    g[1].forEach(function(c) {
      var d = document.createElement('div');
      d.className = 'sidebar-item' + (c.id===activeChatId?' active':'');
      var t = document.createElement('span'); t.className='s-title'; t.textContent=c.title||'New Chat';
      t.onclick = function() { selectChat(c.id); };
      var del = document.createElement('button'); del.className='del-btn'; del.textContent='×';
      del.onclick = function(e) { e.stopPropagation(); deleteChat(c.id); };
      d.appendChild(t); d.appendChild(del); list.appendChild(d);
    });
  });
}

function selectChat(id) {
  activeChatId = id;
  var c = getChat(id);
  if (c) {
    for (var p in PROVIDERS) {
      if (PROVIDERS[p].indexOf(c.model) !== -1) { curProvider = p; curModel = c.model; break; }
    }
    byId('providerDot').style.background = PROVIDER_COLORS[curProvider] || '#888';
    byId('providerBtnText').textContent = curProvider;
    byId('modelBtnText').textContent = curModel;
  }
  updateBadge();
  renderSidebar();
  renderMessages();
  closeSidebar();
}

function deleteChat(id) {
  chats = chats.filter(function(c) { return c.id !== id; });
  saveChats();
  if (activeChatId === id) {
    activeChatId = chats.length ? chats[0].id : null;
    if (activeChatId) { selectChat(activeChatId); return; }
    renderEmpty('');
  }
  renderSidebar();
}

function newChat() {
  activeChatId = null;
  curProvider = DEFAULT_PROVIDER; curModel = DEFAULT_MODEL;
  byId('providerDot').style.background = PROVIDER_COLORS[curProvider] || '#888';
  byId('providerBtnText').textContent = curProvider;
  byId('modelBtnText').textContent = curModel;
  updateBadge();
  renderSidebar();
  renderEmpty(byId('userName').textContent);
  closeSidebar();
  byId('input').focus();
}

// ── Message rendering ─────────────────────────────────
function renderEmpty(name) {
  var m = byId('messages'); m.textContent = '';
  byId('modelBadge').style.display = 'none';
  var es = document.createElement('div'); es.className = 'empty-state';
  var greet = document.createElement('div'); greet.className = 'empty-greeting';
  greet.textContent = name ? 'Good to see you, ' + name.split(' ')[0] + '.' : 'Good to see you.';
  var sub = document.createElement('div'); sub.className = 'empty-sub';
  sub.textContent = 'How can I help you today?';
  var chips = document.createElement('div'); chips.className = 'suggestion-chips';
  SUGGESTIONS.forEach(function(s) {
    var c = document.createElement('button'); c.className='chip'; c.textContent=s;
    c.onclick = function() { byId('input').value=s; autoResize(byId('input')); byId('input').focus(); };
    chips.appendChild(c);
  });
  es.appendChild(greet); es.appendChild(sub); es.appendChild(chips);
  m.appendChild(es);
}

function renderMessages() {
  var c = activeChat(); var m = byId('messages'); m.textContent = '';
  updateBadge();
  if (!c || !c.messages.length) { renderEmpty(byId('userName').textContent); return; }
  c.messages.forEach(function(msg) { appendMsgDom(msg); });
  scrollBottom();
}

function appendMsgDom(msg) {
  var m = byId('messages');
  var es = m.querySelector('.empty-state'); if (es) es.remove();
  var wrap = document.createElement('div'); wrap.className = 'msg ' + msg.role + (msg.error?' error':'');
  if (msg.role === 'user') {
    var bub = document.createElement('div'); bub.className = 'user-bubble';
    bub.textContent = msg.content;
    wrap.appendChild(bub);
  } else {
    var hdr = document.createElement('div'); hdr.className = 'asst-header';
    var av = document.createElement('div'); av.className = 'asst-avatar'; av.textContent = 'AI';
    var lbl = document.createElement('span'); lbl.className = 'asst-label'; lbl.textContent = 'AI Router';
    hdr.appendChild(av); hdr.appendChild(lbl);
    if (msg.provider || msg.model) {
      var pill = document.createElement('span'); pill.className = 'provider-pill';
      pill.textContent = (msg.provider || '') + (msg.provider && msg.model ? ' · ' : '') + (msg.model || '');
      hdr.appendChild(pill);
    }
    var body = document.createElement('div'); body.className = 'asst-body';
    body.appendChild(renderMd(msg.content));
    wrap.appendChild(hdr); wrap.appendChild(body);
  }
  m.appendChild(wrap);
}

function showTyping() {
  var m = byId('messages');
  var wrap = document.createElement('div'); wrap.className = 'msg assistant'; wrap.id = 'typingWrap';
  var hdr = document.createElement('div'); hdr.className = 'asst-header';
  var av = document.createElement('div'); av.className = 'asst-avatar'; av.textContent = 'AI';
  hdr.appendChild(av);
  var tw = document.createElement('div'); tw.className = 'typing-wrap';
  var t = document.createElement('div'); t.className = 'typing';
  for (var i=0;i<3;i++) t.appendChild(document.createElement('span'));
  tw.appendChild(t);
  wrap.appendChild(hdr); wrap.appendChild(tw);
  m.appendChild(wrap); scrollBottom();
}
function hideTyping() { var t = byId('typingWrap'); if(t) t.remove(); }
function scrollBottom() { var m = byId('messages'); m.scrollTop = m.scrollHeight; }

// ── Markdown (DOM-based, XSS-safe) ───────────────────
function renderMd(text) {
  var frag = document.createDocumentFragment();
  var parts = text.split(/(```[\s\S]*?```)/g);
  parts.forEach(function(part) {
    if (/^```[\s\S]*```$/.test(part)) {
      var code = part.replace(/^```\w*\n?/,'').replace(/\n?```$/,'');
      var pre = document.createElement('pre');
      var ce = document.createElement('code'); ce.textContent = code;
      pre.appendChild(ce); frag.appendChild(pre);
    } else {
      part.split(/\n{2,}/).forEach(function(para) {
        if (!para.trim()) return;
        var p = document.createElement('p');
        renderInline(p, para);
        frag.appendChild(p);
      });
    }
  });
  return frag;
}

function renderInline(parent, text) {
  var re = /(\*\*(.+?)\*\*)|(`([^`]+)`)|(\n)/g;
  var last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[1]) { var s = document.createElement('strong'); s.textContent = m[2]; parent.appendChild(s); }
    else if (m[3]) { var c = document.createElement('code'); c.textContent = m[4]; parent.appendChild(c); }
    else if (m[5]) { parent.appendChild(document.createElement('br')); }
    last = m.index + m[0].length;
  }
  if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}

// ── Send ──────────────────────────────────────────────
async function send() {
  var input = byId('input');
  var text = input.value.trim();
  if (!text || sending) return;

  var chat = activeChat();
  if (!chat) {
    chat = {
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      title: text.slice(0,42),
      provider: curProvider, model: curModel,
      messages: [], createdAt: Date.now(), updatedAt: Date.now()
    };
    chats.unshift(chat);
    activeChatId = chat.id;
  }

  var userMsg = {role:'user', content:text, timestamp:Date.now()};
  chat.messages.push(userMsg);
  chat.updatedAt = Date.now();
  chat.model = curModel; chat.provider = curProvider;
  saveChats(); renderSidebar();
  appendMsgDom(userMsg);
  updateBadge();
  scrollBottom();

  input.value = ''; autoResize(input);
  sending = true; byId('sendBtn').disabled = true;
  showTyping();

  try {
    var res = await fetch('/v1/chat/completions', {
      method:'POST',
      headers:{'Authorization':'Bearer '+apiKey,'Content-Type':'application/json'},
      body: JSON.stringify({
        model: curModel,
        stream: true,  // router sends keepalives while long tasks run, so the connection doesn't time out
        messages: chat.messages.map(function(msg) { return {role:msg.role,content:msg.content}; })
      })
    });
    if (res.status === 401) { hideTyping(); signOut(); return; }
    if (!res.ok) {
      hideTyping();
      var errText = 'Error '+res.status;
      try { var j = await res.json(); errText = j.detail || errText; } catch(e){}
      addErrorMsg(chat, errText);
      return;
    }
    var out = await readSSE(res);
    hideTyping();
    if (out.error) {
      addErrorMsg(chat, out.error);
    } else {
      var reply = out.text;
      var aMsg = {role:'assistant',content:reply,model:curModel,provider:curProvider,timestamp:Date.now()};
      chat.messages.push(aMsg); chat.updatedAt = Date.now();
      saveChats(); appendMsgDom(aMsg);
    }
  } catch(e) {
    hideTyping();
    addErrorMsg(chat, 'Connection error. Please try again.');
  } finally {
    sending = false; byId('sendBtn').disabled = false;
    scrollBottom(); input.focus();
  }
}

// Read an OpenAI-style SSE stream → {text} or {error}. Lines starting with ':' are keepalives.
async function readSSE(res) {
  var reader = res.body.getReader(), dec = new TextDecoder(), buf = '', text = '';
  while (true) {
    var r = await reader.read();
    if (r.done) break;
    buf += dec.decode(r.value, {stream:true});
    var lines = buf.split('\n'); buf = lines.pop();
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line.indexOf('data:') !== 0) continue;
      var payload = line.slice(5).trim();
      if (payload === '[DONE]') return {text:text};
      try {
        var evt = JSON.parse(payload);
        if (evt.error) return {error: evt.error.message || 'Upstream error'};
        var d = evt.choices && evt.choices[0] && evt.choices[0].delta;
        if (d && d.content) text += d.content;
      } catch(e) {}
    }
  }
  return text ? {text:text} : {error:'Stream ended without a reply.'};
}

function addErrorMsg(chat, text) {
  var msg = {role:'assistant',content:text,timestamp:Date.now(),error:true};
  chat.messages.push(msg); chat.updatedAt = Date.now();
  saveChats(); appendMsgDom(msg);
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

// ── Sidebar mobile ────────────────────────────────────
function toggleSidebar() {
  byId('sidebar').classList.toggle('open');
  byId('overlay').classList.toggle('open');
}
function closeSidebar() {
  byId('sidebar').classList.remove('open');
  byId('overlay').classList.remove('open');
}

// ── Init ──────────────────────────────────────────────
byId('loginKey').addEventListener('keydown', function(e) { if(e.key==='Enter') signIn(); });
tryAutoLogin();
</script>
