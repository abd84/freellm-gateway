version: "3.9"
services:
  ai-router:
    build: .
    restart: unless-stopped
    ports:
      - "8009:8009"
    env_file: .env
    volumes:
      - ./router/router.db:/app/router/router.db
      - ./router/logs:/app/router/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
